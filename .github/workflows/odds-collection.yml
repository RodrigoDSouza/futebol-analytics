name: Coleta de odds

on:
  schedule:
    - cron: "17 0,8,16 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - name: Coletar Premier League e Brasileirão
        env:
          FUTEBOL_DATABASE_URL: ${{ secrets.FUTEBOL_DATABASE_URL }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: |
          if [ -z "$FUTEBOL_DATABASE_URL" ] || [ -z "$THE_ODDS_API_KEY" ]; then
            echo "Configure FUTEBOL_DATABASE_URL e THE_ODDS_API_KEY nos secrets do repositório."
            exit 0
          fi
          futebol-analytics coletar-odds --liga premier_league
          futebol-analytics coletar-odds --liga brasileirao
      - name: Gerar e avaliar previsões armazenadas
        continue-on-error: true
        env:
          FUTEBOL_DATABASE_URL: ${{ secrets.FUTEBOL_DATABASE_URL }}
        run: |
          futebol-analytics atualizar-previsoes --liga premier_league
          futebol-analytics atualizar-previsoes --liga brasileirao
