name: Manutenção do banco

on:
  schedule:
    - cron: "20 5 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retention:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - name: Aplicar retenção
        env:
          FUTEBOL_DATABASE_URL: ${{ secrets.FUTEBOL_DATABASE_URL }}
        run: |
          if [ -z "$FUTEBOL_DATABASE_URL" ]; then
            echo "Configure o secret FUTEBOL_DATABASE_URL para ativar a retenção semanal."
            exit 0
          fi
          futebol-analytics banco-limpar
