[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "futebol-analytics"
version = "0.1.0"
description = "Coleta e análise de dados do futebol brasileiro"
requires-python = ">=3.12"

[project.scripts]
futebol-analytics = "futebol_analytics.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-p no:cacheprovider --basetemp=.pytest-tmp"

